<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>식스샵 기능 | 페이지·블록·홈페이지 만들기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --accent:#6b5bff;
    --accent-soft:#efeaff;
    --ink:#17171c;
    --muted:#71717f;
    --line:#ececf1;
    --bg:#ffffff;
    --soft:#f6f6f9;
    --radius:18px;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.01em;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

  /* ===== Top nav ===== */
  header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .top .wrap{display:flex;align-items:center;gap:28px;height:66px;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.03em;}
  .logo .dot{width:22px;height:22px;border-radius:7px 7px 7px 2px;background:linear-gradient(135deg,var(--accent),#ff7ab6);display:inline-block;}
  nav.gnb{display:flex;gap:22px;margin-left:6px;font-size:15px;font-weight:600;color:#3a3a44;}
  nav.gnb a.active{color:var(--accent);}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border-radius:999px;cursor:pointer;border:0;font-size:15px;transition:transform .05s ease,opacity .2s;}
  .btn:active{transform:translateY(1px);}
  .btn-dark{background:var(--ink);color:#fff;padding:11px 20px;}
  .btn-ghost{background:transparent;color:#3a3a44;font-weight:600;padding:11px 8px;}
  .btn-accent{background:var(--accent);color:#fff;padding:13px 24px;font-size:16px;}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:12px 22px;}
  .btn-lg{padding:15px 30px;font-size:16px;}

  /* ===== Feature tabs ===== */
  .tabsbar{position:sticky;top:66px;z-index:40;background:#fff;border-bottom:1px solid var(--line);}
  .tabsbar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:12px;}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:var(--soft);color:#54545f;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;border:1px solid transparent;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:var(--accent-soft);color:var(--accent);border-color:#dcd4ff;}
  .tab .g{font-size:11px;opacity:.6;margin-right:6px;font-weight:700;}

  /* ===== Page sections ===== */
  main{padding-bottom:40px;}
  .page{display:none;animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* Hero - 중앙 정렬 */
  section.hero{padding:78px 0 40px;text-align:center;}
  .eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px;margin-bottom:20px;}
  h1{font-size:48px;line-height:1.18;letter-spacing:-.035em;margin:0 0 20px;font-weight:800;}
  .hero p.sub{font-size:19px;color:var(--muted);margin:0 auto 30px;line-height:1.62;max-width:720px;}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .hero-showcase{margin:44px auto 0;max-width:960px;}

  /* Value sections - 이미지 ↔ 텍스트 좌우 배치(교차) */
  .rows{padding:20px 0;}
  .section-blk{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding:56px 0;}
  .section-blk.img-right .media{order:2;}
  .section-blk + .section-blk{border-top:1px solid var(--line);}
  .section-blk .kicker{font-size:14px;font-weight:700;color:var(--accent);margin:0 0 10px;}
  .section-blk h2{font-size:30px;line-height:1.3;letter-spacing:-.03em;margin:0 0 16px;font-weight:800;}
  .section-blk p.lead{font-size:17px;color:#3f3f4a;margin:0 0 16px;line-height:1.62;}
  .section-blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;}
  .section-blk li{position:relative;padding-left:26px;font-size:16px;color:#44444f;}
  .section-blk li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;border-radius:5px;background:var(--accent-soft);border:2px solid var(--accent);}
  .section-blk li b{color:var(--ink);}
  .note{margin-top:16px;font-size:14px;color:#8a8a95;background:var(--soft);border-radius:12px;padding:12px 16px;}

  /* image placeholder */
  .ph{position:relative;width:100%;aspect-ratio:16/10;background:
      repeating-linear-gradient(45deg,#f3f3f7 0 12px,#eeeef4 12px 24px);
    border:1.5px dashed #c7c7d4;border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;padding:22px;color:#8b8b98;}
  .ph .chip{font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--accent);background:#fff;border:1px solid #dcd4ff;border-radius:999px;padding:4px 10px;}
  .ph .desc{font-size:13.5px;line-height:1.55;max-width:88%;color:#7c7c88;}
  .ph.tall{aspect-ratio:4/5;}
  .ph.wide{aspect-ratio:16/7;}

  /* steps */
  .steps{background:var(--soft);border-radius:24px;padding:40px 34px;margin:36px 0;}
  .steps h3{margin:0 0 24px;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .steps .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;}
  .step .num{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:15px;}
  .step .st{font-weight:700;margin-bottom:4px;}
  .step .sd{font-size:14.5px;color:var(--muted);}

  /* usecase */
  .usecase{padding:8px 0 4px;}
  .usecase h3{font-size:20px;font-weight:800;margin:0 0 16px;letter-spacing:-.02em;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14.5px;color:#454550;font-weight:600;}

  /* type table (ai page) */
  .typetable{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:4px;}
  .typetable .t{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .typetable .t b{display:block;color:var(--accent);margin-bottom:6px;font-size:14px;}
  .typetable .t span{font-size:14px;color:#565661;line-height:1.5;}

  /* cta band */
  .ctaband{margin:48px 0 10px;background:linear-gradient(120deg,#1c1b2e,#3a2f6b 60%,#5b4bd6);border-radius:26px;padding:52px 40px;text-align:center;color:#fff;}
  .ctaband h3{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px;}
  .ctaband p{color:#cfc9f0;margin:0 0 26px;font-size:16px;}
  .ctaband .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .ctaband .btn-line{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;}

  footer{border-top:1px solid var(--line);padding:34px 0;color:#9a9aa6;font-size:14px;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  @media (max-width:880px){
    nav.gnb,.top .right .btn-ghost,.mega{display:none;}
    h1{font-size:32px;}
    section.hero{padding:44px 0 16px;}
    .hero-showcase{margin-top:30px;}
    .section-blk{grid-template-columns:1fr;gap:24px;padding:34px 0;}
    .section-blk.img-right .media{order:0;}
    .section-blk h2{font-size:24px;}
    .ctaband{padding:40px 22px;}
    .ctaband h3{font-size:24px;}
  }

  /* ===== Mega menu (hover, Shopify 스타일) ===== */
  .gnb .has-caret::after{content:"⌄";font-size:12px;margin-left:5px;position:relative;top:-2px;opacity:.7;}
  .mega{position:fixed;top:66px;left:0;width:100%;background:#fff;border-top:1px solid var(--line);box-shadow:0 30px 60px -22px rgba(30,25,80,.28);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease,visibility .18s;z-index:48;}
  .mega.open{opacity:1;visibility:visible;transform:none;}
  .mega-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr 1.1fr;gap:32px;padding:32px 24px 38px;align-items:start;}
  .mega-h{font-size:12px;font-weight:800;letter-spacing:.03em;color:#a0a0ad;margin:0 0 10px;}
  .mega-col .mega-group + .mega-group{margin-top:22px;}
  .mega-item{display:block;padding:9px 12px;border-radius:12px;cursor:pointer;transition:background .12s;}
  .mega-item:hover{background:var(--soft);}
  .mega-item b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.3;}
  .mega-item small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;}
  .mega-promo{background:linear-gradient(150deg,#efeaff,#f6f3ff);border:1px solid #e6dfff;border-radius:16px;padding:22px;display:flex;flex-direction:column;min-height:100%;}
  .mega-promo .pt{font-size:16px;font-weight:800;margin:6px 0;color:var(--ink);}
  .mega-promo .pd{font-size:13px;color:#5a5a66;line-height:1.55;}
  .mega-promo .pbtn{margin-top:auto;padding-top:16px;}
  .mega-promo .pbtn button{width:100%;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><span class="dot"></span>sixshop</div>
    <nav class="gnb">
      <a href="#">템플릿</a>
      <a href="#" class="active has-caret" id="feat-trigger">기능</a>
      <a href="#">제작의뢰</a>
      <a href="#">고객사례</a>
      <a href="#">가이드</a>
      <a href="#">요금제</a>
    </nav>
    <div class="right">
      <button class="btn btn-ghost">로그인</button>
      <button class="btn btn-dark">무료로 시작하기</button>
    </div>
  </div>
</header>

<div class="mega" id="mega"><div class="wrap mega-grid" id="megaGrid"></div></div>

<div class="tabsbar">
  <div class="wrap" id="tabs"></div>
</div>

<main id="pages"></main>

<footer>
  <div class="wrap">
    <span>ⓘ 기획용 시안 — 이미지 자리는 영역만 잡아둔 플레이스홀더예요.</span>
    <span>sixshop</span>
  </div>
</footer>

const groupLabel = {"AI 제작 기능":"AI 제작 기능","마켓플레이스":"마켓플레이스","운영":"운영","고급기능":"고급기능"};

function ph(desc, cls=""){
  return `<div class="ph ${cls}"><span class="chip">🖼️ 이미지</span><span class="desc">${desc}</span></div>`;
}

function renderRows(sections){
  // 좌우 배치, 이미지 위치를 번갈아: 짝수=이미지 왼쪽, 홀수=이미지 오른쪽
  return `<div class="rows">` + sections.map((s,i)=>{
    const media = `<div class="media">${ph(s.img)}</div>`;
    const text = `<div class="text">
        <p class="kicker">${s.kicker}</p>
        <h2>${s.h2}</h2>
        ${s.lead?`<p class="lead">${s.lead}</p>`:""}
        ${s.points&&s.points.length?`<ul>${s.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
        ${s.note?`<div class="note">⚠️ ${s.note}</div>`:""}
      </div>`;
    const imgRight = i%2===1;
    return `<div class="section-blk${imgRight?" img-right":""}">${media}${text}</div>`;
  }).join("") + `</div>`;
}

function renderPage(p){
  return `<section class="page" id="page-${p.id}" role="tabpanel">
    <div class="wrap">
      <section class="hero">
        <span class="eyebrow">${p.eyebrow}</span>
        <h1>${p.h1}</h1>
        <p class="sub">${p.sub}</p>
      </section>

      ${renderRows(p.sections)}

      <div class="ctaband">
        <h3>${p.ctaTitle}</h3>
        <p>${p.ctaSub}</p>
        <div class="actions">
          <button class="btn btn-accent btn-lg">무료로 시작하기</button>
          <button class="btn btn-line btn-lg">가이드 보기</button>
        </div>
      </div>
    </div>
  </section>`;
}

const tabsEl = document.getElementById("tabs");
const pagesEl = document.getElementById("pages");
let lastGroup = "";
tabsEl.innerHTML = PAGES.map((p,i)=>{
  const g = p.group!==lastGroup ? `<span class="g">${groupLabel[p.group]}</span>`:"";
  lastGroup = p.group;
  return `<button class="tab${i===0?' active':''}" data-id="${p.id}">${g}${p.tab}</button>`;
}).join("");
pagesEl.innerHTML = PAGES.map((p,i)=>renderPage(p)).join("");
document.querySelector("#page-"+PAGES[0].id).classList.add("active");

function switchTo(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.id===id));
  document.querySelectorAll(".page").forEach(pg=>pg.classList.remove("active"));
  const pg = document.getElementById("page-"+id);
  if(pg) pg.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
tabsEl.addEventListener("click",e=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  switchTo(btn.dataset.id);
});
